apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: demo-app-alerts
  labels:
    app: demo-app
spec:
  groups:
    - name: demo-app
      rules:
        - alert: DemoAppHighErrorRate
          expr: |
            sum(rate(http_server_requests_seconds_count{job="demo-app",status=~"5.."}[1m]))
              / sum(rate(http_server_requests_seconds_count{job="demo-app"}[1m])) > 0.05
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: More than 5 percent of demo-app requests are failing
